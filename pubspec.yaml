name: rasa_route_collaborative_development
version: 1.0.0+1
publish_to: 'none'
description: Rasa Route collaborative development Flutter UI mock-up implementation.

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.2

  # Connects each View to its ViewModel.
  provider: ^6.1.2
  # UI / fonts.
  google_fonts: ^8.0.2

  # Camera + gallery capture (UC500 in-app capture: food / signboard / stall).
  camera: ^0.12.0+2
  image_picker: ^1.2.3

  # Location: GPS fixes + OpenStreetMap picker (UC500 "Add Landmark").
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/figma/
